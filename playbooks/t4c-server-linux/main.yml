---
# T4C Server Linux — WP DevOps Dashboard / Package Installator
# Ansible tourne EN LOCAL sur le serveur deja connecte en SSH (connection: local).
# Pas de handlers, pas de FQCN ansible.builtin.* (Ansible minimal sur cible).
- name: Deploy T4C Server Linux (Docker)
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    deploy_dir: /opt/t4c-server
    github_repo: elestranobaron/t4c-server-linux
    release_tag: ""
    t4c_assets_dir: /opt/t4c-assets/serveur/runtime
    mega_server_url: "https://mega.nz/folder/92YQmLIL#3I9KTlXVp7jmqwu2_2bX_Q"
    t4c_udp_port: 11677
    db_name: t4c_server
    db_user: t4cuser
    db_password_default: "T4Cpass2026!"
    db_root_password_default: "t4c_root_dev"
    db_password: ""
    db_root_password: ""
    t4c_verify_wda_md5: true
    enable_systemd: true
    t4c_staging_assets: /tmp/t4c-server-assets
    docker_runtime_dir: "{{ deploy_dir }}/docker/runtime"
    github_api: "https://api.github.com/repos/{{ github_repo }}"
    resolved_release_tag: main
    wda_min_bytes: 1048576

  tasks:
    - name: Refuse concurrent deploy if lock is recent
      stat:
        path: /tmp/t4c-server-deploy.lock
      register: deploy_lock

    - name: Fail when another deploy appears in progress
      fail:
        msg: >
          Deploiement deja en cours (lock /tmp/t4c-server-deploy.lock).
          Attendez la fin du run en cours. Si le lock est stale apres un Ctrl+C :
          rm -f /tmp/t4c-server-deploy.lock puis relancez.
      when:
        - deploy_lock.stat.exists
        - (ansible_date_time.epoch | int - deploy_lock.stat.mtime | default(0) | int) < 7200

    - name: Create deploy lock for this run
      file:
        path: /tmp/t4c-server-deploy.lock
        state: touch
        mode: "0644"

    - name: Assert supported OS family
      assert:
        that:
          - ansible_os_family in ["Debian", "RedHat", "Archlinux", "Suse"]
        fail_msg: "OS non supporte. Distros : Debian/Ubuntu, Fedora/RHEL, Arch, openSUSE."

    # Credentials: dashboard (extra-vars) > .env existant > defaults docker-compose
    - name: Check for existing deployment .env
      stat:
        path: "{{ deploy_dir }}/.env"
      register: env_file

    - name: Read T4C_DB_PASSWORD from existing .env
      shell: grep -m1 '^T4C_DB_PASSWORD=' "{{ deploy_dir }}/.env" | cut -d= -f2-
      register: env_db_password
      changed_when: false
      failed_when: false
      when:
        - env_file.stat.exists
        - db_password | default('') | length == 0

    - name: Read MARIADB_ROOT_PASSWORD from existing .env
      shell: grep -m1 '^MARIADB_ROOT_PASSWORD=' "{{ deploy_dir }}/.env" | cut -d= -f2-
      register: env_db_root_password
      changed_when: false
      failed_when: false
      when:
        - env_file.stat.exists
        - db_root_password | default('') | length == 0

    - name: Resolve DB credentials for idempotent re-runs
      set_fact:
        db_password: >-
          {{
            db_password
            if (db_password | default('') | length > 0)
            else (
              env_db_password.stdout | trim
              if (env_db_password.stdout | default('') | trim | length > 0)
              else db_password_default
            )
          }}
        db_root_password: >-
          {{
            db_root_password
            if (db_root_password | default('') | length > 0)
            else (
              env_db_root_password.stdout | trim
              if (env_db_root_password.stdout | default('') | trim | length > 0)
              else db_root_password_default
            )
          }}

    - name: Detect Docker stack (CLI, daemon, compose v2 plugin or v1 binary)
      shell: |
        docker --version >/dev/null 2>&1 || { echo "ERR: docker CLI absent"; exit 1; }
        docker info >/dev/null 2>&1 || { echo "ERR: daemon docker injoignable (systemctl start docker ?)"; exit 1; }
        if docker compose version >/dev/null 2>&1; then
          echo "docker compose"
          exit 0
        fi
        if COMPOSE_BIN="$(command -v docker-compose)" && "$COMPOSE_BIN" --version >/dev/null 2>&1; then
          echo "$COMPOSE_BIN"
          exit 0
        fi
        echo "ERR: ni « docker compose » (v2) ni « docker-compose » (v1) trouve"
        exit 1
      register: docker_detect
      changed_when: false
      failed_when: false

    - name: Set docker stack ready flag and compose command
      set_fact:
        docker_stack_ready: "{{ docker_detect.rc == 0 }}"
        docker_compose_cmd: "{{ docker_detect.stdout | trim }}"
      when: docker_detect.rc == 0

    - name: Set docker stack missing flag
      set_fact:
        docker_stack_ready: false
        docker_compose_cmd: ""
      when: docker_detect.rc != 0

    - name: Note docker detection when already OK
      debug:
        msg: >-
          Docker OK sur {{ ansible_distribution }} {{ ansible_distribution_version }}
          — compose={{ docker_compose_cmd }} — installation sautee
      when: docker_stack_ready | bool

    - name: Note docker detection when missing
      debug:
        msg: >-
          Docker/Compose absent sur {{ ansible_distribution }} {{ ansible_distribution_version }}.
          {{ docker_detect.stdout | default('') | trim }}
          — tentative installation via paquets distro (docker.io) puis Docker.com si recent.
      when: not docker_stack_ready | bool

    - name: Ensure git and rsync are available
      package:
        name:
          - git
          - rsync
        state: present
      failed_when: false

    - name: Install Docker stack when missing
      when: not docker_stack_ready | bool
      block:
        - name: "[Debian] Install docker.io + docker-compose from distro repos"
          apt:
            name:
              - docker.io
              - docker-compose
              - git
              - rsync
            state: present
            update_cache: no
          failed_when: false
          when: ansible_os_family == "Debian"

        - name: Re-detect Docker after distro packages (Debian)
          shell: |
            docker info >/dev/null 2>&1 || exit 1
            if docker compose version >/dev/null 2>&1; then echo "docker compose"; exit 0; fi
            if COMPOSE_BIN="$(command -v docker-compose)" && "$COMPOSE_BIN" --version >/dev/null 2>&1; then echo "$COMPOSE_BIN"; exit 0; fi
            exit 1
          register: docker_redetect_debian
          changed_when: false
          failed_when: false
          when: ansible_os_family == "Debian"

        - name: Mark stack ready after distro docker.io install
          set_fact:
            docker_stack_ready: true
            docker_compose_cmd: "{{ docker_redetect_debian.stdout | trim }}"
          when:
            - ansible_os_family == "Debian"
            - docker_redetect_debian.rc | default(1) == 0

        - name: "[Debian] Refresh apt cache (best effort, Docker.com fallback)"
          apt:
            update_cache: yes
            cache_valid_time: 3600
          failed_when: false
          when:
            - ansible_os_family == "Debian"
            - not docker_stack_ready | bool
            - ansible_distribution_major_version | int >= 11

        - name: "[Debian] Install from Docker.com (Debian 11+ only, best effort)"
          block:
            - name: "[Debian] Install Docker prerequisites"
              apt:
                name:
                  - ca-certificates
                  - curl
                  - gnupg
                  - lsb-release
                state: present
                update_cache: no
              failed_when: false

            - name: "[Debian] Add Docker GPG key"
              shell: |
                install -m 0755 -d /etc/apt/keyrings
                curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg \
                  | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
                chmod a+r /etc/apt/keyrings/docker.gpg
              args:
                creates: /etc/apt/keyrings/docker.gpg

            - name: "[Debian] Add Docker APT repository"
              shell: |
                echo \
                  "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
                  https://download.docker.com/linux/{{ ansible_distribution | lower }} \
                  $(. /etc/os-release && echo "${VERSION_CODENAME:-$VERSION_ID}") stable" \
                  > /etc/apt/sources.list.d/docker.list
              args:
                creates: /etc/apt/sources.list.d/docker.list

            - name: "[Debian] Install Docker Engine from Docker.com"
              apt:
                name:
                  - docker-ce
                  - docker-ce-cli
                  - containerd.io
                  - docker-buildx-plugin
                  - docker-compose-plugin
                state: present
                update_cache: no
              failed_when: false
          when:
            - ansible_os_family == "Debian"
            - not docker_stack_ready | bool
            - ansible_distribution_major_version | int >= 11

        - name: "[RedHat] Add Docker repository"
          shell: |
            dnf config-manager --add-repo \
              https://download.docker.com/linux/fedora/docker-ce.repo
          args:
            creates: /etc/yum.repos.d/docker-ce.repo
          when: ansible_os_family == "RedHat"

        - name: "[RedHat] Install Docker Engine"
          dnf:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-compose-plugin
            state: present
          failed_when: false
          when: ansible_os_family == "RedHat"

        - name: "[Arch] Install Docker"
          shell: pacman -Sy --noconfirm docker docker-compose
          args:
            creates: /usr/bin/docker
          when: ansible_os_family == "Archlinux"

        - name: "[Suse] Install Docker"
          shell: zypper -n install docker docker-compose
          args:
            creates: /usr/bin/docker
          when: ansible_os_family == "Suse"

    - name: Final Docker stack detection
      shell: |
        docker info >/dev/null 2>&1 || exit 1
        if docker compose version >/dev/null 2>&1; then echo "docker compose"; exit 0; fi
        if COMPOSE_BIN="$(command -v docker-compose)" && "$COMPOSE_BIN" --version >/dev/null 2>&1; then echo "$COMPOSE_BIN"; exit 0; fi
        exit 1
      register: docker_detect_final
      changed_when: false
      failed_when: false

    - name: Apply final docker compose command
      set_fact:
        docker_stack_ready: "{{ docker_detect_final.rc == 0 }}"
        docker_compose_cmd: "{{ docker_detect_final.stdout | trim }}"
      when: docker_detect_final.rc == 0

    - name: Fail if docker compose still unavailable
      fail:
        msg: >
          Docker Compose introuvable sur {{ ansible_distribution }} {{ ansible_distribution_version }}.
          Verifiez : docker --version && docker info && docker-compose --version
          Debian 10 : paquets « docker.io » + « docker-compose » (pas docker-ce des depots Docker.com).
          Detail detection : {{ docker_detect.stdout | default(docker_detect_final.stderr | default('n/a')) }}
      when: not docker_stack_ready | bool

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started
      failed_when: false

    # ── Release GitHub ────────────────────────────────────────────────────
    - name: Query latest GitHub release
      uri:
        url: "{{ github_api }}/releases/latest"
        return_content: yes
      register: gh_release
      failed_when: false
      when: release_tag | length == 0

    - name: Fallback to GitHub tags list
      uri:
        url: "{{ github_api }}/tags"
        return_content: yes
      register: gh_tags
      when:
        - release_tag | length == 0
        - gh_release.status | default(0) != 200

    - name: Set resolved release tag from GitHub
      set_fact:
        resolved_release_tag: >-
          {{
            release_tag
            if release_tag | length > 0
            else (
              gh_release.json.tag_name
              if (gh_release.status | default(0)) == 200
              else (
                gh_tags.json[0].name
                if (gh_tags.json | default([]) | length > 0)
                else 'v0.1.0-alpha'
              )
            )
          }}

    - name: Clone t4c-server-linux at release tag
      git:
        repo: "https://github.com/{{ github_repo }}.git"
        dest: "{{ deploy_dir }}"
        version: "{{ resolved_release_tag }}"
        force: yes
        depth: 1

    - name: Ensure docker/runtime directory exists
      file:
        path: "{{ docker_runtime_dir }}"
        state: directory
        mode: "0755"

    # ── Assets Vircom (MEGA) ──────────────────────────────────────────────
    - name: Check if Vircom assets already deployed (valid WDA size)
      shell: |
        WDA="{{ docker_runtime_dir }}/WDA/T4C Worlds.WDA"
        test -f "$WDA" && test "$(stat -c%s "$WDA")" -ge {{ wda_min_bytes }}
      register: deployed_assets_check
      changed_when: false
      failed_when: false

    - name: Set deployed assets OK flag
      set_fact:
        deployed_assets_ok: "{{ deployed_assets_check.rc == 0 }}"

    - name: Check local MEGA-synced assets
      stat:
        path: "{{ t4c_assets_dir }}/WDA/T4C Worlds.WDA"
      register: local_assets

    - name: Sync local MEGA assets into docker/runtime
      shell: |
        rsync -a \
          --exclude='logs/' \
          --exclude='SQL/' \
          "{{ t4c_assets_dir }}/" \
          "{{ docker_runtime_dir }}/"
      args:
        executable: /bin/bash
      when: local_assets.stat.exists

    - name: Install MEGAcmd on Debian
      apt:
        deb: "https://mega.nz/linux/repo/Debian_12/amd64/megacmd_2.1.1-1.1_amd64.deb"
      failed_when: false
      when:
        - not deployed_assets_ok | bool
        - not local_assets.stat.exists
        - ansible_os_family == "Debian"

    - name: Download assets from MEGA public folder
      shell: |
        rm -rf "{{ t4c_staging_assets }}"
        mkdir -p "{{ t4c_staging_assets }}"
        mega-get "{{ mega_server_url }}" "{{ t4c_staging_assets }}"
      args:
        executable: /bin/bash
      when:
        - not deployed_assets_ok | bool
        - not local_assets.stat.exists
        - ansible_os_family == "Debian"
      register: mega_dl
      failed_when: false

    - name: Install megatools on Arch
      shell: pacman -Sy --noconfirm megatools
      when:
        - not deployed_assets_ok | bool
        - not local_assets.stat.exists
        - ansible_os_family == "Archlinux"
      failed_when: false

    - name: Download assets from MEGA via megatools
      shell: |
        rm -rf "{{ t4c_staging_assets }}"
        mkdir -p "{{ t4c_staging_assets }}"
        megadl --path="{{ t4c_staging_assets }}" "{{ mega_server_url }}"
      args:
        executable: /bin/bash
      when:
        - not deployed_assets_ok | bool
        - not local_assets.stat.exists
        - ansible_os_family == "Archlinux"
      register: mega_dl_arch
      failed_when: false

    - name: Find WDA after MEGA download
      shell: find "{{ t4c_staging_assets }}" -name 'T4C Worlds.WDA' | head -1
      register: wda_path
      changed_when: false
      failed_when: false
      when:
        - not deployed_assets_ok | bool
        - not local_assets.stat.exists

    - name: Sync MEGA download into docker/runtime
      shell: |
        WDA="{{ wda_path.stdout | trim }}"
        MEGA_RUNTIME="$(dirname "$(dirname "$WDA")")"
        rsync -a --exclude='logs/' --exclude='SQL/' "${MEGA_RUNTIME}/" "{{ docker_runtime_dir }}/"
      args:
        executable: /bin/bash
      when:
        - not deployed_assets_ok | bool
        - not local_assets.stat.exists
        - wda_path.stdout | default('') | trim | length > 0

    - name: Assert Vircom assets are present
      stat:
        path: "{{ docker_runtime_dir }}/WDA/T4C Worlds.WDA"
      register: wda_final

    - name: Fail if Vircom assets missing
      assert:
        that:
          - wda_final.stat.exists
        fail_msg: >
          Assets Vircom introuvables dans {{ docker_runtime_dir }}.
          Sync MEGA vers t4c_assets_dir={{ t4c_assets_dir }}
          ou verifiez mega_server_url.

    - name: Patch T4CServer.ini DB credentials
      lineinfile:
        path: "{{ docker_runtime_dir }}/T4CServer.ini"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: no
      loop:
        - { regexp: '^DB_USER=', line: "DB_USER={{ db_user }}" }
        - { regexp: '^DB_PWD=', line: "DB_PWD={{ db_password }}" }
      failed_when: false

    - name: Ensure docker scripts are executable
      file:
        path: "{{ deploy_dir }}/docker/{{ item }}"
        mode: "0755"
      loop:
        - entrypoint.sh
        - sync-runtime-from-build.sh

    - name: Write docker compose .env
      copy:
        dest: "{{ deploy_dir }}/.env"
        mode: "0600"
        content: |
          MARIADB_ROOT_PASSWORD={{ db_root_password }}
          T4C_DB_NAME={{ db_name }}
          T4C_DB_USER={{ db_user }}
          T4C_DB_PASSWORD={{ db_password }}
          T4C_UDP_PORT={{ t4c_udp_port }}
          T4C_RUNTIME_ASSETS={{ docker_runtime_dir }}
          T4C_VERIFY_WDA_MD5={{ '1' if (t4c_verify_wda_md5 | bool) else '0' }}

    - name: Build and start stack via docker/Dockerfile (safe to re-run after Ctrl+C)
      shell: "{{ docker_compose_cmd }} up -d --build --remove-orphans"
      args:
        chdir: "{{ deploy_dir }}"

    - name: Wait for t4cserver container (boot WDA may take minutes)
      shell: docker ps --filter "name=t4cserver" --filter "status=running" -q | grep -q .
      register: t4c_up
      retries: 30
      delay: 10
      until: t4c_up.rc == 0
      failed_when: false

    - name: Install systemd unit for docker compose stack
      copy:
        dest: /etc/systemd/system/t4c-server-docker.service
        mode: "0644"
        content: |
          [Unit]
          Description=T4C Server Linux (Docker Compose)
          Requires=docker.service
          After=docker.service network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory={{ deploy_dir }}
          ExecStart=/bin/bash -lc 'cd {{ deploy_dir }} && {{ docker_compose_cmd }} up -d'
          ExecStop=/bin/bash -lc 'cd {{ deploy_dir }} && {{ docker_compose_cmd }} down'
          TimeoutStartSec=600

          [Install]
          WantedBy=multi-user.target
      when: enable_systemd | bool

    - name: Enable t4c-server-docker systemd service
      systemd:
        name: t4c-server-docker
        enabled: yes
        daemon_reload: yes
        state: started
      when: enable_systemd | bool

    - name: Remove deploy lock after run
      file:
        path: /tmp/t4c-server-deploy.lock
        state: absent

    - name: Print deployment summary
      debug:
        msg:
          - "T4C Server Linux deploye (Docker)"
          - "Release     : {{ resolved_release_tag }}"
          - "Code        : {{ deploy_dir }}"
          - "Dockerfile  : {{ deploy_dir }}/docker/Dockerfile"
          - "Assets      : {{ docker_runtime_dir }}/"
          - "Port UDP    : {{ t4c_udp_port }}"
          - "Compose cmd : {{ docker_compose_cmd }}"
          - "Logs        : cd {{ deploy_dir }} && {{ docker_compose_cmd }} logs -f t4cserver"
          - "Relance safe : ce playbook est idempotent — Ctrl+C / refresh UI OK, relancer."
