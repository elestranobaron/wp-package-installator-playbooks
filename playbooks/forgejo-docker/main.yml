---
- name: Deploy Forgejo via Docker Compose
  hosts: all
  become: true
  vars:
    app_dir: "/opt/forgejo-docker"

  tasks:
    - name: Ensure application directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: 1000
        group: 1000
        mode: '0755'

    - name: Deploy Forgejo docker-compose.yml
      copy:
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: 1000
        group: 1000
        mode: '0644'
        content: |
          version: '3'
          services:
            server:
              image: codeberg.org/forgejo/forgejo:7
              container_name: forgejo
              restart: always
              environment:
                - USER_UID=1000
                - USER_GID=1000
              volumes:
                - ./data:/data
                - /etc/timezone:/etc/timezone:ro
                - /etc/localtime:/etc/localtime:ro
              ports:
                - "{{ forgejo_web_port }}:3000"
                - "{{ forgejo_ssh_port }}:22"

    - name: Start Forgejo Stack via Docker Compose
      docker_compose:
        project_src: "{{ app_dir }}"
        state: present
