---
# =============================================================================
# Radio 42 Server — Playbook Ansible
# Déploiement Docker cross-plateforme (Debian, Ubuntu, Raspbian, Arch, Fedora)
# Stack : MPD + Icecast2 + Liquidsoap + API REST de contrôle
# =============================================================================
# Radio 42 Server Playbook — Thomas Lloancy — Unlicense
- name: Deploy Radio 42 Server (Docker)
  hosts: all
  become: true

  vars:
    # ── Valeurs par défaut (surchargées par Package Installator) ──────────
    stream_name: "Ma Radio 42"
    stream_description: "Powered by Radio 42"
    icecast_port: 8000
    api_port: 5000
    live_harbor_port: 8005
    icecast_source_password: "changeme_source"
    icecast_admin_password: "changeme_admin"
    api_secret_key: "changeme_api_key"
    music_dir: "/opt/radio42/music"
    deploy_dir: "/opt/radio42"

    # ── Internes ──────────────────────────────────────────────────────────
    mpd_port: 6600              # interne Docker, non exposé par défaut
    icecast_relay_password: "changeme_relay"
    docker_network: "radio42_net"

  # =========================================================================
  # PRÉ-VÉRIFICATIONS
  # =========================================================================
  pre_tasks:

    - name: Gather OS facts
      ansible.builtin.setup:
        gather_subset: ['distribution', 'architecture']

    - name: Assert supported OS family
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'RedHat', 'Archlinux', 'Suse']
        fail_msg: >
          OS non supporté : {{ ansible_os_family }}.
          Distributions supportées : Debian/Ubuntu/Raspbian, Fedora/RHEL, Arch, openSUSE.

    - name: Assert passwords are not default
      ansible.builtin.assert:
        that:
          - icecast_source_password != "changeme_source"
          - icecast_admin_password != "changeme_admin"
          - api_secret_key != "changeme_api_key"
        fail_msg: >
          SÉCURITÉ : Les mots de passe par défaut ne sont pas acceptés.
          Veuillez définir icecast_source_password, icecast_admin_password et api_secret_key.

  # =========================================================================
  # INSTALLATION DOCKER
  # =========================================================================
  tasks:

    # ── Debian / Ubuntu / Raspbian ─────────────────────────────────────────
    - name: "[Debian] Install Docker prerequisites"
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-docker
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: "[Debian] Add Docker GPG key"
      ansible.builtin.shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
      when: ansible_os_family == "Debian"

    - name: "[Debian] Add Docker APT repository"
      ansible.builtin.shell: |
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/{{ ansible_distribution | lower }} \
          $(lsb_release -cs) stable" \
          > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list
      when: ansible_os_family == "Debian"

    - name: "[Debian] Install Docker Engine"
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    # ── Fedora / RHEL ──────────────────────────────────────────────────────
    - name: "[RedHat] Add Docker repository"
      ansible.builtin.shell: |
        dnf config-manager --add-repo \
          https://download.docker.com/linux/fedora/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo
      when: ansible_os_family == "RedHat"

    - name: "[RedHat] Install Docker Engine"
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - python3-docker
        state: present
      when: ansible_os_family == "RedHat"

    # ── Arch Linux ─────────────────────────────────────────────────────────
    - name: "[Arch] Install Docker"
      community.general.pacman:
        name:
          - docker
          - docker-compose
          - python-docker
        state: present
      when: ansible_os_family == "Archlinux"

    # ── openSUSE ───────────────────────────────────────────────────────────
    - name: "[Suse] Install Docker"
      community.general.zypper:
        name:
          - docker
          - docker-compose
          - python3-docker
        state: present
      when: ansible_os_family == "Suse"

    # ── Docker : démarrage universel ───────────────────────────────────────
    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # =========================================================================
    # STRUCTURE DES DOSSIERS
    # =========================================================================

    - name: Create deploy directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ deploy_dir }}"
        - "{{ deploy_dir }}/config"
        - "{{ deploy_dir }}/config/mpd"
        - "{{ deploy_dir }}/config/icecast"
        - "{{ deploy_dir }}/config/liquidsoap"
        - "{{ deploy_dir }}/config/api"
        - "{{ music_dir }}"
        - "{{ deploy_dir }}/playlists"
        - "{{ deploy_dir }}/logs"
        - "{{ deploy_dir }}/data/mpd"

    # =========================================================================
    # FICHIERS DE CONFIGURATION (depuis templates)
    # =========================================================================

    - name: Deploy MPD config
      ansible.builtin.template:
        src: mpd.conf.j2
        dest: "{{ deploy_dir }}/config/mpd/mpd.conf"
        mode: '0644'

    - name: Deploy Icecast config
      ansible.builtin.template:
        src: icecast.xml.j2
        dest: "{{ deploy_dir }}/config/icecast/icecast.xml"
        mode: '0644'

    - name: Deploy Liquidsoap script
      ansible.builtin.template:
        src: radio.liq.j2
        dest: "{{ deploy_dir }}/config/liquidsoap/radio.liq"
        mode: '0644'

    - name: Deploy API control script
      ansible.builtin.copy:
        src: radio_api.py
        dest: "{{ deploy_dir }}/config/api/radio_api.py"
        mode: '0755'

    - name: Deploy API Dockerfile
      ansible.builtin.copy:
        src: Dockerfile.api
        dest: "{{ deploy_dir }}/config/api/Dockerfile"
        mode: '0644'

    - name: Deploy API requirements.txt
      ansible.builtin.copy:
        src: requirements.api.txt
        dest: "{{ deploy_dir }}/config/api/requirements.txt"
        mode: '0644'

    # =========================================================================
    # DOCKER COMPOSE
    # =========================================================================

    - name: Deploy docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: '0644'

    # =========================================================================
    # DÉMARRAGE DE LA STACK
    # =========================================================================

    - name: Pull Docker images
      community.docker.docker_compose_v2_pull:
        project_src: "{{ deploy_dir }}"
      register: pull_result
      ignore_errors: true  # Si le module n'est pas dispo, on utilise le fallback shell

    - name: "[Fallback] Pull Docker images via shell"
      ansible.builtin.shell: docker compose pull
      args:
        chdir: "{{ deploy_dir }}"
      when: pull_result is failed

    - name: Build and start Radio 42 stack
      ansible.builtin.shell: docker compose up -d --build --remove-orphans
      args:
        chdir: "{{ deploy_dir }}"
      register: compose_up

    - name: Wait for Icecast to be ready
      ansible.builtin.wait_for:
        host: localhost
        port: "{{ icecast_port }}"
        timeout: 30
        state: started

    - name: Wait for API to be ready
      ansible.builtin.wait_for:
        host: localhost
        port: "{{ api_port }}"
        timeout: 30
        state: started

    # =========================================================================
    # SYSTEMD : auto-restart au boot
    # =========================================================================

    - name: Deploy systemd service for auto-start
      ansible.builtin.template:
        src: radio42.service.j2
        dest: /etc/systemd/system/radio42.service
        mode: '0644'
      notify: Reload systemd

    - name: Enable radio42 systemd service
      ansible.builtin.systemd:
        name: radio42
        enabled: true
        daemon_reload: true

    # =========================================================================
    # RÉSUMÉ POST-INSTALLATION
    # =========================================================================

    - name: Print deployment summary
      ansible.builtin.debug:
        msg: |
          ✅ Radio 42 Server déployé avec succès !
          ─────────────────────────────────────────
          🎵 Flux Icecast  : http://{{ ansible_default_ipv4.address }}:{{ icecast_port }}/stream
          🛠️  Admin Icecast : http://{{ ansible_default_ipv4.address }}:{{ icecast_port }}/admin
          🔌 API contrôle  : http://{{ ansible_default_ipv4.address }}:{{ api_port }}
          🎙️  Live micro    : harbor port {{ live_harbor_port }} (mot de passe source Icecast)
          📁 Musique       : {{ music_dir }}
          📋 Playlists     : {{ deploy_dir }}/playlists
          📜 Logs          : {{ deploy_dir }}/logs
          ─────────────────────────────────────────
          Configurez votre plugin WordPress avec :
          - URL API : http://{{ ansible_default_ipv4.address }}:{{ api_port }}
          - Clé API : (celle que vous avez définie)

  # =========================================================================
  # HANDLERS
  # =========================================================================
  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
