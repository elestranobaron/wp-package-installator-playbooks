---
# T4C Server Linux — WP DevOps Dashboard / Package Installator
# Compatible Ansible 2.2+ : pas de FQCN, pas de loop, pas de replace, pas de lookup pipe.
# Modules : shell, copy, file, stat, lineinfile, git, apt, debug, fail, set_fact, systemd, uri.
- name: Deploy T4C Server Linux (Docker)
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    deploy_dir: /opt/t4c-server
    github_repo: elestranobaron/t4c-server-linux
    release_tag: ""
    t4c_assets_dir: /opt/t4c-assets/serveur/runtime
    mega_server_url: "https://mega.nz/folder/92YQmLIL#3I9KTlXVp7jmqwu2_2bX_Q"
    t4c_udp_port: 11677
    db_name: t4c_server
    db_user: t4cuser
    db_password_default: "T4Cpass2026!"
    db_root_password_default: "t4c_root_dev"
    db_password: ""
    db_root_password: ""
    t4c_verify_wda_md5: true
    enable_systemd: true
    t4c_staging_assets: /tmp/t4c-server-assets
    docker_runtime_dir: "{{ deploy_dir }}/docker/runtime"
    github_api: "https://api.github.com/repos/{{ github_repo }}"
    resolved_release_tag: main
    wda_min_bytes: 1048576
    compose_project_name: t4cstack
    t4c_container_mariadb: t4c-stack-mariadb
    t4c_container_server: t4c-stack-server
    t4c_image_name: t4c-server-linux:local
    t4c_build_stamp_file: "{{ deploy_dir }}/.t4c-docker-build.stamp"
    mariadb_odbc_src_url: "https://mirror.mariadb.org/connector-odbc-3.2.7/mariadb-connector-odbc-3.2.7-src.tar.gz"
    mariadb_connc_src_url: "https://mirror.mariadb.org/connector-c-3.4.7/mariadb-connector-c-3.4.7-src.tar.gz"

  tasks:
    - name: Refuse concurrent deploy if lock is recent
      stat:
        path: /tmp/t4c-server-deploy.lock
      register: deploy_lock

    - name: Fail when another deploy appears in progress
      fail:
        msg: >
          Deploiement deja en cours (lock /tmp/t4c-server-deploy.lock).
          Attendez la fin du run en cours. Si le lock est stale apres un Ctrl+C :
          rm -f /tmp/t4c-server-deploy.lock puis relancez.
      when:
        - deploy_lock.stat.exists
        - (ansible_date_time.epoch | int - deploy_lock.stat.mtime | default(0) | int) < 7200

    - name: Create deploy lock for this run
      file:
        path: /tmp/t4c-server-deploy.lock
        state: touch
        mode: "0644"

    - name: Show Ansible version
      debug:
        msg: "Ansible {{ ansible_version.full }} — playbook compatible 2.2+ (shell/copy/lineinfile/python3)"

    - name: Fail on unsupported OS family
      fail:
        msg: "OS non supporte. Distros : Debian/Ubuntu, Fedora/RHEL, Arch, openSUSE."
      when: ansible_os_family not in ["Debian", "RedHat", "Archlinux", "Suse"]

    # Credentials: dashboard (extra-vars) > .env existant > defaults docker-compose
    - name: Check for existing deployment .env
      stat:
        path: "{{ deploy_dir }}/.env"
      register: env_file

    - name: Read T4C_DB_PASSWORD from existing .env
      shell: grep -m1 '^T4C_DB_PASSWORD=' "{{ deploy_dir }}/.env" | cut -d= -f2-
      register: env_db_password
      changed_when: false
      failed_when: false
      when:
        - env_file.stat.exists
        - db_password | default('') | length == 0

    - name: Read MARIADB_ROOT_PASSWORD from existing .env
      shell: grep -m1 '^MARIADB_ROOT_PASSWORD=' "{{ deploy_dir }}/.env" | cut -d= -f2-
      register: env_db_root_password
      changed_when: false
      failed_when: false
      when:
        - env_file.stat.exists
        - db_root_password | default('') | length == 0

    - name: Resolve DB credentials for idempotent re-runs
      set_fact:
        db_password: "{{ db_password if (db_password | default('') | length > 0) else (env_db_password.stdout | default('') if (env_db_password.stdout | default('') | length > 0) else db_password_default) }}"
        db_root_password: "{{ db_root_password if (db_root_password | default('') | length > 0) else (env_db_root_password.stdout | default('') if (env_db_root_password.stdout | default('') | length > 0) else db_root_password_default) }}"

    - name: Detect Docker stack (CLI, daemon, compose v2 plugin or v1 binary)
      shell: |
        docker --version >/dev/null 2>&1 || { echo "ERR: docker CLI absent"; exit 1; }
        docker info >/dev/null 2>&1 || { echo "ERR: daemon docker injoignable (systemctl start docker ?)"; exit 1; }
        if docker compose version >/dev/null 2>&1; then
          echo "docker compose"
          exit 0
        fi
        if COMPOSE_BIN="$(command -v docker-compose)" && "$COMPOSE_BIN" --version >/dev/null 2>&1; then
          echo "$COMPOSE_BIN"
          exit 0
        fi
        echo "ERR: ni docker compose (v2) ni docker-compose (v1) trouve"
        exit 1
      register: docker_detect
      changed_when: false
      failed_when: false

    - name: Set docker stack ready flag and compose command
      set_fact:
        docker_stack_ready: yes
        docker_compose_cmd: "{{ docker_detect.stdout }}"
      when: docker_detect.rc == 0

    - name: Set docker stack missing flag
      set_fact:
        docker_stack_ready: no
        docker_compose_cmd: ""
      when: docker_detect.rc != 0

    - name: Note docker detection when already OK
      debug:
        msg: "Docker OK sur {{ ansible_distribution }} {{ ansible_distribution_version }} — compose={{ docker_compose_cmd }} — installation sautee"
      when: docker_stack_ready | default(no)

    - name: Note docker detection when missing
      debug:
        msg: "Docker/Compose absent sur {{ ansible_distribution }} {{ ansible_distribution_version }}. {{ docker_detect.stdout | default('') }} — tentative installation paquets distro."
      when: not (docker_stack_ready | default(no))

    - name: "[Debian] Ensure git and rsync"
      apt:
        name:
          - git
          - rsync
        state: present
        update_cache: no
      failed_when: false
      when: ansible_os_family == "Debian"

    - name: "[RedHat] Ensure git and rsync"
      shell: dnf install -y git rsync || yum install -y git rsync
      changed_when: false
      failed_when: false
      when: ansible_os_family == "RedHat"

    - name: "[Arch] Ensure git and rsync"
      shell: pacman -Sy --noconfirm git rsync
      changed_when: false
      failed_when: false
      when: ansible_os_family == "Archlinux"

    - name: "[Suse] Ensure git and rsync"
      shell: zypper -n install git rsync
      changed_when: false
      failed_when: false
      when: ansible_os_family == "Suse"

    - name: "[Debian] Install docker.io + docker-compose from distro repos"
      apt:
        name:
          - docker.io
          - docker-compose
        state: present
        update_cache: no
      failed_when: false
      when:
        - not (docker_stack_ready | default(no))
        - ansible_os_family == "Debian"

    - name: Re-detect Docker after distro packages (Debian)
      shell: |
        docker info >/dev/null 2>&1 || exit 1
        if docker compose version >/dev/null 2>&1; then echo "docker compose"; exit 0; fi
        if COMPOSE_BIN="$(command -v docker-compose)" && "$COMPOSE_BIN" --version >/dev/null 2>&1; then echo "$COMPOSE_BIN"; exit 0; fi
        exit 1
      register: docker_redetect_debian
      changed_when: false
      failed_when: false
      when:
        - not (docker_stack_ready | default(no))
        - ansible_os_family == "Debian"

    - name: Mark stack ready after distro docker.io install
      set_fact:
        docker_stack_ready: yes
        docker_compose_cmd: "{{ docker_redetect_debian.stdout }}"
      when:
        - ansible_os_family == "Debian"
        - docker_redetect_debian.rc | default(1) == 0

    - name: "[Debian 11+] Refresh apt cache (best effort)"
      apt:
        update_cache: yes
        cache_valid_time: 3600
      failed_when: false
      when:
        - ansible_os_family == "Debian"
        - not (docker_stack_ready | default(no))
        - ansible_distribution_major_version | int >= 11

    - name: "[Debian 11+] Install Docker prerequisites"
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: no
      failed_when: false
      when:
        - ansible_os_family == "Debian"
        - not (docker_stack_ready | default(no))
        - ansible_distribution_major_version | int >= 11

    - name: "[Debian 11+] Add Docker GPG key"
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
      when:
        - ansible_os_family == "Debian"
        - not (docker_stack_ready | default(no))
        - ansible_distribution_major_version | int >= 11

    - name: "[Debian 11+] Add Docker APT repository"
      shell: |
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/{{ ansible_distribution | lower }} \
          $(. /etc/os-release && echo "${VERSION_CODENAME:-$VERSION_ID}") stable" \
          > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list
      when:
        - ansible_os_family == "Debian"
        - not (docker_stack_ready | default(no))
        - ansible_distribution_major_version | int >= 11

    - name: "[Debian 11+] Install Docker Engine from Docker.com"
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: no
      failed_when: false
      when:
        - ansible_os_family == "Debian"
        - not (docker_stack_ready | default(no))
        - ansible_distribution_major_version | int >= 11

    - name: "[RedHat] Add Docker repository"
      shell: dnf config-manager --add-repo https://download.docker.com/linux/fedora/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo
      when:
        - not (docker_stack_ready | default(no))
        - ansible_os_family == "RedHat"

    - name: "[RedHat] Install Docker Engine"
      shell: dnf install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
      changed_when: false
      failed_when: false
      when:
        - not (docker_stack_ready | default(no))
        - ansible_os_family == "RedHat"

    - name: "[Arch] Install Docker"
      shell: pacman -Sy --noconfirm docker docker-compose
      args:
        creates: /usr/bin/docker
      when:
        - not (docker_stack_ready | default(no))
        - ansible_os_family == "Archlinux"

    - name: "[Suse] Install Docker"
      shell: zypper -n install docker docker-compose
      args:
        creates: /usr/bin/docker
      when:
        - not (docker_stack_ready | default(no))
        - ansible_os_family == "Suse"

    - name: Final Docker stack detection
      shell: |
        docker info >/dev/null 2>&1 || exit 1
        if docker compose version >/dev/null 2>&1; then echo "docker compose"; exit 0; fi
        if COMPOSE_BIN="$(command -v docker-compose)" && "$COMPOSE_BIN" --version >/dev/null 2>&1; then echo "$COMPOSE_BIN"; exit 0; fi
        exit 1
      register: docker_detect_final
      changed_when: false
      failed_when: false

    - name: Apply final docker compose command
      set_fact:
        docker_stack_ready: yes
        docker_compose_cmd: "{{ docker_detect_final.stdout }}"
      when: docker_detect_final.rc == 0

    - name: Fail if docker compose still unavailable
      fail:
        msg: >
          Docker Compose introuvable sur {{ ansible_distribution }} {{ ansible_distribution_version }}.
          Verifiez : docker --version && docker info && docker-compose --version
          Debian 10 : paquets docker.io + docker-compose (pas docker-ce Docker.com).
          Detail : {{ docker_detect.stdout | default(docker_detect_final.stderr | default('n/a')) }}
      when: not (docker_stack_ready | default(no))

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started
      failed_when: false

    # ── Release GitHub ────────────────────────────────────────────────────
    - name: Query latest GitHub release
      uri:
        url: "{{ github_api }}/releases/latest"
        return_content: yes
      register: gh_release
      failed_when: false
      when: release_tag | length == 0

    - name: Fallback to GitHub tags list
      uri:
        url: "{{ github_api }}/tags"
        return_content: yes
      register: gh_tags
      when:
        - release_tag | length == 0
        - gh_release.status | default(0) != 200

    - name: Set resolved release tag from GitHub
      set_fact:
        resolved_release_tag: "{{ release_tag if release_tag | length > 0 else (gh_release.json.tag_name if (gh_release.status | default(0)) == 200 else (gh_tags.json[0].name if (gh_tags.json | default([]) | length > 0) else 'v0.1.0-alpha')) }}"

    - name: Check Vircom runtime before git clone (for backup)
      shell: |
        WDA="{{ docker_runtime_dir }}/WDA/T4C Worlds.WDA"
        test -f "$WDA" && test "$(stat -c%s "$WDA")" -ge {{ wda_min_bytes }}
      register: runtime_backup_needed
      changed_when: false
      failed_when: false

    - name: Backup docker/runtime before git clone
      shell: rm -rf /tmp/t4c-runtime-backup && rsync -a "{{ docker_runtime_dir }}/" /tmp/t4c-runtime-backup/
      when: runtime_backup_needed.rc == 0

    - name: Clone t4c-server-linux at release tag
      git:
        repo: "https://github.com/{{ github_repo }}.git"
        dest: "{{ deploy_dir }}"
        version: "{{ resolved_release_tag }}"
        force: yes

    - name: Restore docker/runtime backup after git clone
      shell: rsync -a /tmp/t4c-runtime-backup/ "{{ docker_runtime_dir }}/"
      when: runtime_backup_needed.rc == 0

    - name: Ensure docker/runtime directory exists
      file:
        path: "{{ docker_runtime_dir }}"
        state: directory
        mode: "0755"

    # ── Assets Vircom (MEGA / sync locale) ────────────────────────────────
    - name: Verify WDA in docker/runtime
      shell: |
        WDA="{{ docker_runtime_dir }}/WDA/T4C Worlds.WDA"
        test -f "$WDA" && test "$(stat -c%s "$WDA")" -ge {{ wda_min_bytes }}
      register: wda_check
      changed_when: false
      failed_when: false

    - name: Set WDA missing flag
      set_fact:
        wda_missing: yes
      when: wda_check.rc != 0

    - name: Set WDA present flag
      set_fact:
        wda_missing: no
      when: wda_check.rc == 0

    - name: Check local asset source path
      stat:
        path: "{{ t4c_assets_dir }}/WDA/T4C Worlds.WDA"
      register: local_wda

    - name: Sync assets from t4c_assets_dir
      shell: |
        rsync -a \
          --exclude='logs/' \
          --exclude='SQL/' \
          "{{ t4c_assets_dir }}/" \
          "{{ docker_runtime_dir }}/"
      args:
        executable: /bin/bash
      when:
        - wda_missing | default(no)
        - local_wda.stat.exists

    - name: Re-verify WDA after local sync
      shell: |
        WDA="{{ docker_runtime_dir }}/WDA/T4C Worlds.WDA"
        test -f "$WDA" && test "$(stat -c%s "$WDA")" -ge {{ wda_min_bytes }}
      register: wda_check_local
      changed_when: false
      failed_when: false
      when: local_wda.stat.exists

    - name: Update WDA missing flag after local sync
      set_fact:
        wda_missing: yes
      when:
        - local_wda.stat.exists
        - wda_check_local.rc != 0

    - name: Update WDA present flag after local sync
      set_fact:
        wda_missing: no
      when:
        - local_wda.stat.exists
        - wda_check_local.rc == 0

    - name: Assets Vircom deja valides — skip MEGA (normal)
      debug:
        msg: "WDA OK dans {{ docker_runtime_dir }} — etapes MEGA skipees, on continue vers Docker."
      when: not (wda_missing | default(no))

    - name: Install megatools on Debian
      apt:
        name: megatools
        state: present
        update_cache: no
      when:
        - wda_missing | default(no)
        - ansible_os_family == "Debian"

    - name: Install megatools on Arch
      shell: pacman -Sy --noconfirm megatools
      when:
        - wda_missing | default(no)
        - ansible_os_family == "Archlinux"

    - name: Require megadl binary
      shell: command -v megadl && megadl --version
      register: megadl_bin
      changed_when: false
      failed_when: megadl_bin.rc != 0
      when: wda_missing | default(no)

    - name: Download MEGA folder (mega_server_url) with log
      shell: |
        set -e
        rm -rf "{{ t4c_staging_assets }}"
        mkdir -p "{{ t4c_staging_assets }}"
        LOG=/tmp/t4c-megadl.log
        : > "$LOG"
        megadl --path="{{ t4c_staging_assets }}" "{{ mega_server_url }}" >>"$LOG" 2>&1
        find "{{ t4c_staging_assets }}" -maxdepth 5 -type d | head -20 >>"$LOG"
      args:
        executable: /bin/bash
      register: mega_dl
      when: wda_missing | default(no)

    - name: Locate WDA in MEGA staging tree
      shell: |
        find "{{ t4c_staging_assets }}" -name 'T4C Worlds.WDA' -size +{{ wda_min_bytes }}c 2>/dev/null | head -1
      register: wda_staging_path
      changed_when: false
      failed_when: false
      when: wda_missing | default(no)

    - name: Fail with diagnostics when MEGA provision failed
      fail:
        msg: |
          megadl a echoue ou WDA absent apres telechargement MEGA.

          URL utilisee : {{ mega_server_url }}
          megadl rc={{ mega_dl.rc | default('?') }}
          Log complet  : /tmp/t4c-megadl.log
          stderr       : {{ mega_dl.stderr | default('') }}

          Test manuel sur le serveur :
            apt-get install -y megatools
            megadl --path=/tmp/test-mega '{{ mega_server_url }}'
            find /tmp/test-mega -name 'T4C Worlds.WDA'
      when:
        - wda_missing | default(no)
        - mega_dl.rc | default(1) != 0 or (wda_staging_path.stdout | default('') | length == 0)

    - name: MEGA download OK
      debug:
        msg: "MEGA OK — WDA={{ wda_staging_path.stdout | default('') }} — log /tmp/t4c-megadl.log"
      when: wda_missing | default(no)

    - name: Sync MEGA staging into docker/runtime
      shell: |
        WDA="{{ wda_staging_path.stdout | default('') }}"
        RUNTIME="${WDA%/WDA/T4C Worlds.WDA}"
        test -n "$RUNTIME" && test -d "$RUNTIME/WDA"
        rsync -a --exclude='logs/' --exclude='SQL/' "${RUNTIME}/" "{{ docker_runtime_dir }}/"
      args:
        executable: /bin/bash
      when: wda_missing | default(no)

    - name: Re-verify WDA after MEGA sync
      shell: |
        WDA="{{ docker_runtime_dir }}/WDA/T4C Worlds.WDA"
        test -f "$WDA" && test "$(stat -c%s "$WDA")" -ge {{ wda_min_bytes }}
      register: wda_check_mega
      changed_when: false
      failed_when: false
      when: wda_missing | default(no)

    - name: Update WDA missing flag after MEGA sync
      set_fact:
        wda_missing: yes
      when:
        - wda_missing | default(no)
        - wda_check_mega.rc != 0

    - name: Update WDA present flag after MEGA sync
      set_fact:
        wda_missing: no
      when:
        - wda_missing | default(no)
        - wda_check_mega.rc == 0

    - name: Fail if Vircom assets still invalid
      fail:
        msg: |
          WDA invalide ou absent : {{ docker_runtime_dir }}/WDA/T4C Worlds.WDA
          (taille minimale {{ wda_min_bytes }} octets)

          Voir log MEGA : /tmp/t4c-megadl.log
      when: wda_missing | default(no)

    - name: Patch T4CServer.ini DB credentials
      lineinfile:
        path: "{{ docker_runtime_dir }}/T4CServer.ini"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: no
      with_items:
        - { regexp: '^DB_USER=', line: "DB_USER={{ db_user }}" }
        - { regexp: '^DB_PWD=', line: "DB_PWD={{ db_password }}" }
      failed_when: false

    - name: Ensure docker scripts are executable
      file:
        path: "{{ deploy_dir }}/docker/{{ item }}"
        mode: "0755"
      with_items:
        - entrypoint.sh
        - sync-runtime-from-build.sh

    - name: Check docker-compose fixed container names already applied
      shell: "grep -q 'container_name: {{ t4c_container_mariadb }}' \"{{ deploy_dir }}/docker-compose.yml\""
      register: compose_names_patched
      changed_when: false
      failed_when: false

    - name: Patch docker-compose.yml mariadb container name
      lineinfile:
        path: "{{ deploy_dir }}/docker-compose.yml"
        insertafter: '^  mariadb:$'
        line: "    container_name: {{ t4c_container_mariadb }}"
      when: compose_names_patched.rc != 0

    - name: Patch docker-compose.yml t4cserver container name
      lineinfile:
        path: "{{ deploy_dir }}/docker-compose.yml"
        insertafter: '^  t4cserver:$'
        line: "    container_name: {{ t4c_container_server }}"
      when: compose_names_patched.rc != 0

    - name: Write docker compose .env
      copy:
        dest: "{{ deploy_dir }}/.env"
        mode: "0600"
        content: |
          COMPOSE_PROJECT_NAME={{ compose_project_name }}
          MARIADB_ROOT_PASSWORD={{ db_root_password }}
          T4C_DB_NAME={{ db_name }}
          T4C_DB_USER={{ db_user }}
          T4C_DB_PASSWORD={{ db_password }}
          T4C_UDP_PORT={{ t4c_udp_port }}
          T4C_RUNTIME_ASSETS={{ docker_runtime_dir }}
          T4C_VERIFY_WDA_MD5={{ '1' if t4c_verify_wda_md5 else '0' }}
          COMPOSE_HTTP_TIMEOUT=1200
          DOCKER_CLIENT_TIMEOUT=1200

    - name: Detect legacy Docker build flags (Docker engine older than 20 only)
      shell: |
        LEGACY=0
        V=$(docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}' 2>/dev/null | cut -d. -f1)
        if [ -n "$V" ] && [ "$V" -lt 20 ] 2>/dev/null; then LEGACY=1; fi
        echo "$LEGACY"
      register: docker_legacy_raw
      changed_when: false
      failed_when: false

    - name: Show Docker build mode
      debug:
        msg: "compose={{ docker_compose_cmd }} — legacy={{ docker_legacy_raw.stdout | trim }} (1=Docker 18, 0=Arch Dockerfile du repo)"

    - name: Set docker legacy flag
      set_fact:
        docker_legacy: yes
      when: docker_legacy_raw.stdout | default('0') | int == 1

    - name: Set docker modern flag
      set_fact:
        docker_legacy: no
      when: docker_legacy_raw.stdout | default('0') | int == 0

    - name: Check legacy native-build Dockerfile already applied
      shell: grep -q 'T4C legacy native build' "{{ deploy_dir }}/docker/Dockerfile"
      register: dockerfile_legacy_ok
      changed_when: false
      failed_when: false
      when: docker_legacy | default(no)

    - name: "[legacy] Install native build dependencies on host"
      apt:
        name:
          - build-essential
          - cmake
          - pkg-config
          - git
          - libssl-dev
          - unixodbc-dev
          - libmariadb-dev
          - libasound2-dev
          - libpulse-dev
          - libx11-dev
          - libxext-dev
          - libxrandr-dev
          - libxcursor-dev
          - libxinerama-dev
          - libxi-dev
          - libdbus-1-dev
          - libudev-dev
          - libgles2-mesa-dev
          - libegl1-mesa-dev
          - libdrm-dev
          - libgbm-dev
          - gettext-base
        state: present
        update_cache: no
      failed_when: false
      when: docker_legacy | default(no)

    - name: "[legacy] Install cmake 3.16+ from backports on Debian 10"
      apt:
        name: cmake
        state: present
        default_release: buster-backports
        update_cache: no
      failed_when: false
      when:
        - docker_legacy | default(no)
        - ansible_os_family == "Debian"
        - ansible_distribution_major_version | int == 10

    - name: "[legacy] Install SDL3 build script on host"
      copy:
        dest: /tmp/t4c-build-sdl3.sh
        mode: "0755"
        content: |
          #!/bin/bash
          set -euo pipefail
          DEPS="{{ deploy_dir }}/.deps"
          SDL_SRC="$DEPS/SDL"
          SDL_BUILD="$DEPS/SDL/build"
          LOG=/tmp/t4c-sdl3-build.log

          if ls "$SDL_BUILD"/libSDL3.so* >/dev/null 2>&1; then
            echo "SDL3 deja present dans $SDL_BUILD" >> "$LOG"
            exit 0
          fi

          echo "=== $(date -Is) build SDL3 ===" >> "$LOG"
          cmake --version >> "$LOG" 2>&1
          rm -rf "$SDL_SRC"
          mkdir -p "$DEPS"
          git clone --depth 1 --branch release-3.2.8 https://github.com/libsdl-org/SDL.git "$SDL_SRC" >> "$LOG" 2>&1
          cmake -S "$SDL_SRC" -B "$SDL_BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_WAYLAND=OFF \
            -DSDL_PIPEWIRE=OFF >> "$LOG" 2>&1
          cmake --build "$SDL_BUILD" -j"$(nproc)" >> "$LOG" 2>&1
          ls -la "$SDL_BUILD"/libSDL3.so* >> "$LOG" 2>&1
          test -f "$SDL_BUILD/libSDL3.so" || ls "$SDL_BUILD"/libSDL3.so* >/dev/null
      when: docker_legacy | default(no)

    - name: "[legacy] Build SDL3 on host if missing"
      shell: /tmp/t4c-build-sdl3.sh
      args:
        executable: /bin/bash
      register: sdl3_host_build
      when: docker_legacy | default(no)

    - name: "[legacy] Verify SDL3 built in repo .deps"
      shell: ls "{{ deploy_dir }}/.deps/SDL/build/libSDL3.so*" >/dev/null 2>&1
      register: sdl3_on_host
      changed_when: false
      failed_when: false
      when: docker_legacy | default(no)

    - name: "[legacy] Read SDL3 build log tail on failure"
      shell: tail -40 /tmp/t4c-sdl3-build.log 2>/dev/null || echo "(log absent)"
      register: sdl3_log_tail
      changed_when: false
      failed_when: false
      when:
        - docker_legacy | default(no)
        - sdl3_on_host.rc | default(1) != 0

    - name: "[legacy] Fail if SDL3 missing on host"
      fail:
        msg: |
          SDL3 introuvable dans {{ deploy_dir }}/.deps/SDL/build/ (cmake 3.16+ requis sur Debian 10).

          Log : /tmp/t4c-sdl3-build.log
          {{ sdl3_log_tail.stdout | default('') }}
      when:
        - docker_legacy | default(no)
        - sdl3_on_host.rc | default(1) != 0

    - name: "[legacy] Build T4CServer natively on host"
      shell: |
        cd "{{ deploy_dir }}"
        cmake -S . -B build -DCMAKE_CXX_STANDARD=17 -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="{{ deploy_dir }}/.deps/SDL/build"
        cmake --build build -j"$(nproc)"
      register: t4c_native_build
      failed_when: false
      when: docker_legacy | default(no)

    - name: "[legacy] Fail if native T4CServer build failed"
      fail:
        msg: |
          Compilation native T4CServer echouee (rc={{ t4c_native_build.rc }}).
          Verifiez les deps sur {{ ansible_distribution }} {{ ansible_distribution_version }}.
      when:
        - docker_legacy | default(no)
        - t4c_native_build.rc | default(1) != 0

    - name: "[legacy] Stage binary and libs for docker runtime image"
      shell: |
        set -euo pipefail
        ST="{{ deploy_dir }}/docker/staging"
        BIN="{{ deploy_dir }}/build/T4CServer"
        rm -rf "$ST"
        mkdir -p "$ST/lib" "$ST/bin"
        test -x "$BIN"
        cp "$BIN" "$ST/T4CServer"
        copy_libs() {
          ldd "$1" 2>/dev/null | awk '/=> \// {print $3}' | sort -u | while read -r lib; do
            [ -f "$lib" ] || continue
            case "$lib" in
              /lib/x86_64-linux-gnu/libc.so*|/lib64/libc.so*|/lib*/ld-linux*) continue ;;
            esac
            cp -a "$lib" "$ST/lib/"
          done
        }
        copy_libs "$BIN"
        for f in "{{ deploy_dir }}/.deps/SDL/build"/libSDL3.so*; do
          [ -e "$f" ] && cp -a "$f" "$ST/lib/"
        done
        if command -v envsubst >/dev/null 2>&1; then
          cp "$(command -v envsubst)" "$ST/bin/envsubst"
          copy_libs "$ST/bin/envsubst"
        fi
      args:
        executable: /bin/bash
      when: docker_legacy | default(no)

    - name: "[legacy] Install runtime-only Dockerfile (no apt in docker — Docker 18)"
      copy:
        dest: "{{ deploy_dir }}/docker/Dockerfile"
        content: |
          # T4C legacy native build — binaire compile sur l'hote, image runtime sans apt
          FROM debian:buster-slim

          COPY docker/staging/lib/ /usr/local/lib/
          COPY docker/staging/T4CServer /srv/t4c/T4CServer
          COPY docker/odbc/ /opt/t4c-odbc/
          COPY docker/entrypoint.sh /usr/local/bin/t4c-entrypoint.sh
          COPY docker/staging/bin/envsubst /usr/bin/envsubst

          RUN echo /usr/local/lib > /etc/ld.so.conf.d/t4c.conf \
            && ldconfig \
            && chmod +x /usr/local/bin/t4c-entrypoint.sh /srv/t4c/T4CServer /usr/bin/envsubst \
            && mkdir -p /srv/t4c/logs /srv/t4c/WDA /opt/t4c-assets

          ENV T4C_APP_DIR=/srv/t4c \
              T4C_ASSETS_DIR=/opt/t4c-assets \
              T4C_VERIFY_WDA_MD5=1

          EXPOSE 11677/udp

          ENTRYPOINT ["/usr/local/bin/t4c-entrypoint.sh"]
      when:
        - docker_legacy | default(no)
        - dockerfile_legacy_ok.rc | default(1) != 0

    - name: Install Arch Dockerfile patch script (Docker 20+)
      copy:
        dest: /tmp/t4c-patch-dockerfile.py
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          import pathlib
          import re
          import sys

          MCO_SRC = "{{ mariadb_odbc_src_url }}"
          MCC_SRC = "{{ mariadb_connc_src_url }}"
          MCO_MARKER = "mariadb-connector-c-3.4.7-src.tar.gz"

          p = pathlib.Path("{{ deploy_dir }}/docker/Dockerfile")
          text = p.read_text()

          if "pacman-key --init" not in text:
              old = "RUN pacman -Sy --noconfirm \\"
              new = (
                  "RUN mkdir -p /var/lib/pacman/sync /var/lib/pacman/local \\\n"
                  " && pacman-key --init \\\n"
                  " && pacman-key --populate archlinux \\\n"
                  " && pacman -Sy --noconfirm archlinux-keyring \\\n"
                  " && pacman -Su --noconfirm \\\n"
                  " && pacman -Sy --noconfirm \\"
              )
              if old not in text:
                  sys.stderr.write("pattern pacman introuvable dans Dockerfile\n")
                  sys.exit(1)
              text = text.replace(old, new)

          text = text.replace("    mariadb-connector-odbc \\\n", "")
          text = text.replace("    mariadb-libs \\\n", "")

          runtime_copy = "COPY docker/runtime/ /opt/t4c-assets/\n"
          if runtime_copy in text:
              text = text.replace(
                  runtime_copy,
                  "# assets montes via compose (T4C_RUNTIME_ASSETS), pas dans le build context\n"
                  "RUN mkdir -p /opt/t4c-assets\n",
              )

          text = re.sub(
              r"\nRUN (?:(?:pacman -Sy --noconfirm cmake base-devel \\\n )?"
              r")?(?:&& )?curl -fsSL -o /tmp/m(?:co|cc)-src\.tgz[^\n]*"
              r"(?:\\?\n(?: &&[^\n\\]*)*)+",
              "",
              text,
          )

          if MCO_MARKER not in text or "USE_SYSTEM_INSTALLED_LIB" in text:
              marker = "FROM archlinux:latest AS runtime"
              idx = text.find(marker)
              if idx < 0:
                  sys.stderr.write("stage runtime introuvable dans Dockerfile\n")
                  sys.exit(1)
              before = text[:idx]
              after = text[idx:]
              runtime_head = after.split("WORKDIR /srv/t4c", 1)[0]
              runtime_tail = "WORKDIR /srv/t4c" + after.split("WORKDIR /srv/t4c", 1)[1]
              if "    curl \\" not in runtime_head:
                  runtime_head = runtime_head.replace(
                      "    gettext \\",
                      "    curl \\\n    gettext \\",
                      1,
                  )
              odbc_run = (
                  "\nRUN pacman -Sy --noconfirm cmake base-devel \\\n"
                  f" && curl -fsSL -o /tmp/mco-src.tgz \"{MCO_SRC}\" \\\n"
                  f" && curl -fsSL -o /tmp/mcc-src.tgz \"{MCC_SRC}\" \\\n"
                  " && mkdir -p /tmp/mco-src /tmp/mco-src/libmariadb /tmp/mco-build \\\n"
                  " && tar -xzf /tmp/mco-src.tgz -C /tmp/mco-src --strip-components=1 \\\n"
                  " && tar -xzf /tmp/mcc-src.tgz -C /tmp/mco-src/libmariadb --strip-components=1 \\\n"
                  " && cmake -S /tmp/mco-src -B /tmp/mco-build \\\n"
                  "    -DCMAKE_BUILD_TYPE=Release -DCONC_WITH_UNIT_TESTS=Off -DCMAKE_INSTALL_PREFIX=/usr \\\n"
                  " && cmake --build /tmp/mco-build -j\"$(nproc)\" \\\n"
                  " && cmake --install /tmp/mco-build \\\n"
                  " && MAODBC=\"$(find /usr/lib /tmp/mco-build -name 'libmaodbc.so' -type f | head -1)\" \\\n"
                  " && LMARIADB=\"$(find /usr/lib /tmp/mco-build -name 'libmariadb.so*' -type f | head -1)\" \\\n"
                  " && test -n \"$MAODBC\" && test -n \"$LMARIADB\" \\\n"
                  " && install -m 755 \"$MAODBC\" /usr/lib/libmaodbc.so \\\n"
                  " && install -m 755 \"$LMARIADB\" /usr/lib/libmariadb.so \\\n"
                  " && ldconfig \\\n"
                  " && rm -rf /tmp/mco-src.tgz /tmp/mcc-src.tgz /tmp/mco-src /tmp/mco-build \\\n"
                  " && pacman -Rns --noconfirm cmake base-devel \\\n"
                  " && pacman -Scc --noconfirm\n"
              )
              scc = "&& pacman -Scc --noconfirm"
              pos = runtime_head.find(scc)
              if pos < 0:
                  sys.stderr.write("pacman -Scc introuvable dans stage runtime\n")
                  sys.exit(1)
              end = runtime_head.find("\n", pos)
              runtime_head = runtime_head[: end + 1] + odbc_run + runtime_head[end + 1 :]
              text = before + runtime_head + runtime_tail

          p.write_text(text)
          sys.exit(0)
      when: not (docker_legacy | default(no))

    - name: Patch docker ODBC DSN template (T4C Server + T4C Server Authentication)
      copy:
        dest: "{{ deploy_dir }}/docker/odbc/odbc.ini.template"
        content: |
          [T4C Server Authentication]
          Driver=MariaDB
          Server=${T4C_DB_HOST}
          Port=${T4C_DB_PORT}
          Database=${T4C_DB_NAME}
          User=${T4C_DB_USER}
          Password=${T4C_DB_PASSWORD}
          Option=3

          [T4C Server]
          Driver=MariaDB
          Server=${T4C_DB_HOST}
          Port=${T4C_DB_PORT}
          Database=${T4C_DB_NAME}
          User=${T4C_DB_USER}
          Password=${T4C_DB_PASSWORD}
          Option=3
      when: not (docker_legacy | default(no))

    - name: Patch docker ODBC driver registration (Driver only, no Setup=)
      copy:
        dest: "{{ deploy_dir }}/docker/odbc/odbcinst.ini"
        content: |
          [MariaDB]
          Description=MariaDB ODBC driver
          Driver=/usr/lib/libmaodbc.so
          UsageCount=1
      when: not (docker_legacy | default(no))

    - name: Fix T4CServer.ini ODBC_DB_SRCNAME (USERS_DSN lu par T4CServer)
      lineinfile:
        path: "{{ docker_runtime_dir }}/T4CServer.ini"
        regexp: '^ODBC_DB_SRCNAME='
        line: "ODBC_DB_SRCNAME=T4C Server Authentication"
        insertafter: '^ODBC_DSN='
      when: not (docker_legacy | default(no))

    - name: Install entrypoint with ODBC DSN preflight (T4CServer ODBC_DB_SRCNAME)
      copy:
        dest: "{{ deploy_dir }}/docker/entrypoint.sh"
        mode: "0755"
        content: |
          #!/bin/sh
          # Stage strategic assets into the server "home" (same layout as local build/).
          set -eu

          APP_DIR="${T4C_APP_DIR:-/srv/t4c}"
          ASSETS_DIR="${T4C_ASSETS_DIR:-/opt/t4c-assets}"
          T4C_DB_HOST="${T4C_DB_HOST:-mariadb}"
          T4C_DB_PORT="${T4C_DB_PORT:-3306}"
          T4C_DB_NAME="${T4C_DB_NAME:-t4c_server}"
          T4C_DB_USER="${T4C_DB_USER:-t4cuser}"
          T4C_DB_PASSWORD="${T4C_DB_PASSWORD:-T4Cpass2026!}"
          export T4C_DB_HOST T4C_DB_PORT T4C_DB_NAME T4C_DB_USER T4C_DB_PASSWORD

          log() { printf '[t4c-entrypoint] %s\n' "$*"; }

          mkdir -p "$APP_DIR/logs" "$APP_DIR/WDA"

          if [ -d "$ASSETS_DIR" ] && [ -n "$(ls -A "$ASSETS_DIR" 2>/dev/null || true)" ]; then
              log "Staging assets from ${ASSETS_DIR} -> ${APP_DIR}"
              cp -a "$ASSETS_DIR/." "$APP_DIR/"
          else
              log "WARN: no assets in ${ASSETS_DIR}; relying on image copy only"
          fi

          mkdir -p /etc
          if [ -f /opt/t4c-odbc/odbcinst.ini ]; then
              cp /opt/t4c-odbc/odbcinst.ini /etc/odbcinst.ini
          fi
          if [ -f /opt/t4c-odbc/odbc.ini.template ]; then
              log "Generating /etc/odbc.ini (host=${T4C_DB_HOST})"
              envsubst < /opt/t4c-odbc/odbc.ini.template > /etc/odbc.ini
          fi
          export ODBCINI=/etc/odbc.ini
          export ODBCSYSINI=/etc

          missing=0
          for f in \
              "$APP_DIR/T4CServer.ini" \
              "$APP_DIR/WDA/T4C Worlds.WDA" \
              "$APP_DIR/WDA/T4C Edit.WDA" \
              "$APP_DIR/WDA/NPCs.WDA"
          do
              if [ ! -f "$f" ]; then
                  log "MISSING required asset: $f"
                  missing=1
              fi
          done

          if ! ls "$APP_DIR"/*.elng >/dev/null 2>&1; then
              log "MISSING required asset: *.elng in ${APP_DIR} (see LangDB1 in T4CServer.ini)"
              missing=1
          fi

          if [ ! -x "$APP_DIR/T4CServer" ]; then
              log "MISSING executable: ${APP_DIR}/T4CServer"
              missing=1
          fi

          if [ "$missing" -ne 0 ]; then
              log "Fill docker/runtime/ (./docker/sync-runtime-from-build.sh) or mount T4C_RUNTIME_ASSETS"
              exit 1
          fi

          if [ "${T4C_VERIFY_WDA_MD5:-1}" = "1" ]; then
              worlds_md5=$(md5sum "$APP_DIR/WDA/T4C Worlds.WDA" | awk '{print $1}')
              edit_md5=$(md5sum "$APP_DIR/WDA/T4C Edit.WDA" | awk '{print $1}')
              if [ "$worlds_md5" != "f972edd2d4b663dfceb2127c41b0e1c0" ] || \
                 [ "$edit_md5" != "3f1dcf1a6d95066bdc39196f378c39fe" ]; then
                  log "WARN: WDA MD5 mismatch (expected LP64 pair from CHANGELOG)"
                  log "      Worlds.WDA=${worlds_md5}"
                  log "      Edit.WDA=${edit_md5}"
                  log "      Set T4C_VERIFY_WDA_MD5=0 to skip this check"
              fi
          fi

          if command -v isql >/dev/null 2>&1; then
              T4C_ODBC_DSN="T4C Server"
              if [ -f "$APP_DIR/T4CServer.ini" ]; then
                  _src=$(grep -m1 '^ODBC_DB_SRCNAME=' "$APP_DIR/T4CServer.ini" | cut -d= -f2- | tr -d '\r')
                  if [ -n "$_src" ]; then
                      T4C_ODBC_DSN="$_src"
                  else
                      _dsn=$(grep -m1 '^ODBC_DSN=' "$APP_DIR/T4CServer.ini" | cut -d= -f2- | tr -d '\r')
                      [ -n "$_dsn" ] && T4C_ODBC_DSN="$_dsn"
                  fi
              fi
              log "ODBC preflight -> DSN '${T4C_ODBC_DSN}' host=${T4C_DB_HOST}:${T4C_DB_PORT} db=${T4C_DB_NAME}"
              if ! printf 'SELECT 1;\n' | isql -b -v "$T4C_ODBC_DSN" "$T4C_DB_USER" "$T4C_DB_PASSWORD" >/tmp/t4c-odbc-preflight.log 2>&1; then
                  log "FAIL: ODBC preflight — DSN '${T4C_ODBC_DSN}' inaccessible"
                  tail -20 /tmp/t4c-odbc-preflight.log >&2 || true
                  exit 111
              fi
              log "ODBC preflight OK (DSN=${T4C_ODBC_DSN})"
          else
              log "WARN: isql absent — ODBC preflight skipped"
          fi

          cd "$APP_DIR"
          log "Starting T4CServer (cwd=${APP_DIR}) — WDA boot may take several minutes"
          exec ./T4CServer
      when: not (docker_legacy | default(no))

    - name: Patch Arch Dockerfile (pacman-key + MariaDB ODBC)
      shell: python3 /tmp/t4c-patch-dockerfile.py
      register: dockerfile_patch_run
      changed_when: dockerfile_patch_run.rc == 0
      failed_when: dockerfile_patch_run.rc != 0
      when: not (docker_legacy | default(no))

    - name: Purge orphan t4c containers from failed runs
      shell: |
        set +e
        docker rm -f {{ t4c_container_mariadb }} {{ t4c_container_server }} 2>/dev/null
        for id in $(docker ps -aq --filter "name=t4c-server_mariadb"); do docker rm -f "$id"; done
        for id in $(docker ps -aq --filter "name=t4c-server_t4cserver"); do docker rm -f "$id"; done
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Write .dockerignore to shrink build context (exclude .git; runtime via volume)
      copy:
        dest: "{{ deploy_dir }}/.dockerignore"
        content: |
          .git
          .gitignore
          build/
          build_backup_*/
          .deps/
          docker/runtime
          docker/staging/
          **/logs
          .env

    - name: Verify MariaDB ODBC source tarball reachable (fail fast before Docker build)
      uri:
        url: "{{ mariadb_odbc_src_url }}"
        method: HEAD
        follow_redirects: all
        status_code: 200
        timeout: 30
      when: not (docker_legacy | default(no))

    - name: Verify MariaDB Connector/C source tarball reachable
      uri:
        url: "{{ mariadb_connc_src_url }}"
        method: HEAD
        follow_redirects: all
        status_code: 200
        timeout: 30
      when: not (docker_legacy | default(no))

    - name: Compute Docker build stamp (rebuild only when these change)
      shell: |
        cd "{{ deploy_dir }}"
        { test -f docker/Dockerfile && cat docker/Dockerfile; \
          test -f docker/entrypoint.sh && cat docker/entrypoint.sh; \
          test -f docker/odbc/odbcinst.ini && cat docker/odbc/odbcinst.ini; \
          test -f docker/odbc/odbc.ini.template && cat docker/odbc/odbc.ini.template; \
          test -f docker/runtime/T4CServer.ini && cat docker/runtime/T4CServer.ini; \
        } | md5sum | awk '{print $1}'
      register: t4c_build_stamp
      changed_when: false
      failed_when: false

    - name: Read previous Docker build stamp
      shell: cat "{{ t4c_build_stamp_file }}" 2>/dev/null || true
      register: t4c_old_build_stamp
      changed_when: false
      failed_when: false

    - name: Check fixed-tag t4c image exists locally
      shell: docker image inspect {{ t4c_image_name }} >/dev/null 2>&1
      register: t4c_image_present
      changed_when: false
      failed_when: false

    - name: Skip docker build when stamp unchanged and image present
      set_fact:
        t4c_skip_docker_build: yes
      when:
        - t4c_image_present.rc | default(1) == 0
        - t4c_old_build_stamp.stdout | default('') | trim == t4c_build_stamp.stdout | default('') | trim

    - name: Default run docker build
      set_fact:
        t4c_skip_docker_build: no
      when: t4c_skip_docker_build is not defined

    - name: Show docker build plan
      debug:
        msg: "image={{ t4c_image_name }} — build={{ 'skip (stamp inchangé)' if t4c_skip_docker_build else 'rebuild' }} — stamp={{ t4c_build_stamp.stdout | trim }}"

    - name: Stop t4cserver and remove fixed-tag image before rebuild
      shell: |
        docker rm -f {{ t4c_container_server }} 2>/dev/null || true
        docker rmi {{ t4c_image_name }} 2>/dev/null || true
      changed_when: false
      failed_when: false
      when: not (t4c_skip_docker_build | default(no))

    - name: Pull MariaDB image first
      shell: "{{ docker_compose_cmd }} -p {{ compose_project_name }} pull mariadb"
      args:
        chdir: "{{ deploy_dir }}"
      environment:
        COMPOSE_HTTP_TIMEOUT: "1200"
        DOCKER_CLIENT_TIMEOUT: "1200"
      register: compose_pull
      failed_when: false

    - name: Build t4cserver image (log /tmp/t4c-docker-build.log)
      shell: |
        set -e
        LOG=/tmp/t4c-docker-build.log
        : > "$LOG"
        echo "=== $(date -Is) build t4cserver image={{ t4c_image_name }} legacy={{ docker_legacy | default(no) }} ===" >> "$LOG"
        {{ docker_compose_cmd }} -p {{ compose_project_name }} build t4cserver >>"$LOG" 2>&1
        echo "$BUILD_STAMP" > "{{ t4c_build_stamp_file }}"
      args:
        chdir: "{{ deploy_dir }}"
      environment:
        COMPOSE_HTTP_TIMEOUT: "1200"
        DOCKER_CLIENT_TIMEOUT: "1200"
        DOCKER_BUILDKIT: "{{ '0' if (docker_legacy | default(no)) else '1' }}"
        COMPOSE_DOCKER_CLI_BUILD: "{{ '0' if (docker_legacy | default(no)) else '1' }}"
        BUILD_STAMP: "{{ t4c_build_stamp.stdout | trim }}"
      register: compose_build
      failed_when: false
      when: not (t4c_skip_docker_build | default(no))

    - name: Mark docker build skipped (stamp inchange, image deja presente)
      set_fact:
        compose_build:
          rc: 0
          skipped: true
      when: t4c_skip_docker_build | default(no)

    - name: Read docker build log tail on failure
      shell: tail -60 /tmp/t4c-docker-build.log 2>/dev/null || echo "(log absent)"
      register: docker_build_log_tail
      changed_when: false
      failed_when: false
      when: compose_build.rc | default(1) != 0

    - name: Fail if docker build failed (voir log)
      fail:
        msg: |
          Build image t4cserver echoue (rc={{ compose_build.rc }}).
          Docker legacy={{ docker_legacy | default(no) }}

          Log : /tmp/t4c-docker-build.log
          Dernieres lignes :
          {{ docker_build_log_tail.stdout | default('') }}

          Log complet : tail -100 /tmp/t4c-docker-build.log
          Build manuel : cd {{ deploy_dir }} && {{ docker_compose_cmd }} -p {{ compose_project_name }} build t4cserver
      when: compose_build.rc | default(1) != 0

    - name: Start Docker stack
      shell: "{{ docker_compose_cmd }} -p {{ compose_project_name }} up -d --remove-orphans --no-build >> /tmp/t4c-docker-up.log 2>&1"
      args:
        chdir: "{{ deploy_dir }}"
      environment:
        COMPOSE_HTTP_TIMEOUT: "1200"
        DOCKER_CLIENT_TIMEOUT: "1200"
      register: compose_up
      failed_when: false

    - name: Read docker up log tail on failure
      shell: tail -40 /tmp/t4c-docker-up.log 2>/dev/null || echo "(log absent)"
      register: docker_up_log_tail
      changed_when: false
      failed_when: false
      when: compose_up.rc | default(1) != 0

    - name: Fail if docker up failed (voir log)
      fail:
        msg: |
          docker-compose up a echoue (rc={{ compose_up.rc }}).
          Log : /tmp/t4c-docker-up.log
          {{ docker_up_log_tail.stdout | default('') }}
      when: compose_up.rc | default(1) != 0

    - name: Wait for t4c-stack-server stable (detect restart loop / ODBC boot fail)
      shell: |
        set +e
        NAME="{{ t4c_container_server }}"
        sleep 12
        for i in 1 2 3 4 5 6; do
          ST=$(docker inspect -f '{{ "{{" }}.State.Status{{ "}}" }}' "$NAME" 2>/dev/null)
          RC=$(docker inspect -f '{{ "{{" }}.State.ExitCode{{ "}}" }}' "$NAME" 2>/dev/null)
          RST=$(docker inspect -f '{{ "{{" }}.RestartCount{{ "}}" }}' "$NAME" 2>/dev/null)
          echo "try=$i status=$ST exit=$RC restarts=$RST"
          if [ "$ST" = "restarting" ]; then
            docker logs "$NAME" 2>&1 | tail -30
            exit 1
          fi
          if [ "$ST" = "exited" ]; then
            docker logs "$NAME" 2>&1 | tail -30
            exit 1
          fi
          if [ "$ST" = "running" ]; then
            LOG=$(docker logs "$NAME" 2>&1 | tail -100)
            echo "$LOG" | grep -q 'ODBC preflight OK' && exit 0
            echo "$LOG" | grep -q 'FAIL: ODBC preflight' && exit 2
            echo "$LOG" | grep -q '\[BOOT\] SERVER_READY' && exit 0
            if [ "$i" -ge 6 ]; then
              echo "$LOG" | tail -30
              exit 3
            fi
          fi
          sleep 10
        done
        exit 1
      register: t4c_health
      changed_when: false
      failed_when: false

    - name: Fail if t4c-server restart loop or boot failure
      fail:
        msg: |
          t4c-stack-server ne reste pas up apres deploy (rc sante={{ t4c_health.rc }}).

          Verifier :
            docker ps -a --filter name={{ t4c_container_server }}
            docker logs {{ t4c_container_server }} --tail 80

          rc=1 : restart loop (souvent exit 111 = ODBC)
          rc=2 : ODBC preflight FAIL dans entrypoint
          rc=3 : conteneur running mais pas SERVER_READY / preflight OK (boot WDA lent ou bloque)

          Dernier diagnostic playbook :
          {{ t4c_health.stdout | default('') }}
      when: t4c_health.rc | default(1) != 0

    - name: Install systemd unit for docker compose stack
      copy:
        dest: /etc/systemd/system/t4c-server-docker.service
        mode: "0644"
        content: |
          [Unit]
          Description=T4C Server Linux (Docker Compose)
          Requires=docker.service
          After=docker.service network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory={{ deploy_dir }}
          Environment=COMPOSE_HTTP_TIMEOUT=600
          Environment=DOCKER_CLIENT_TIMEOUT=600
          ExecStart=/bin/bash -lc 'cd {{ deploy_dir }} && {{ docker_compose_cmd }} -p {{ compose_project_name }} up -d --no-build'
          ExecStop=/bin/bash -lc 'cd {{ deploy_dir }} && {{ docker_compose_cmd }} -p {{ compose_project_name }} down'
          TimeoutStartSec=600

          [Install]
          WantedBy=multi-user.target
      when: enable_systemd | default(true)

    - name: Reload systemd after unit install
      shell: systemctl daemon-reload
      changed_when: false
      failed_when: false
      when: enable_systemd | default(true)

    - name: Enable t4c-server-docker systemd service
      systemd:
        name: t4c-server-docker
        enabled: yes
        state: started
      when: enable_systemd | default(true)

    - name: Remove deploy lock after run
      file:
        path: /tmp/t4c-server-deploy.lock
        state: absent

    - name: Print deployment summary
      debug:
        msg:
          - "T4C Server Linux deploye (Docker)"
          - "Release     : {{ resolved_release_tag }}"
          - "Code        : {{ deploy_dir }}"
          - "Dockerfile  : {{ deploy_dir }}/docker/Dockerfile"
          - "Assets      : {{ docker_runtime_dir }}/"
          - "Port UDP    : {{ t4c_udp_port }}"
          - "Compose     : {{ docker_compose_cmd }} -p {{ compose_project_name }}"
          - "Image       : {{ t4c_image_name }}"
          - "Conteneurs  : {{ t4c_container_mariadb }}, {{ t4c_container_server }}"
          - "Logs        : docker logs -f {{ t4c_container_server }}"
          - "Relance safe : ce playbook est idempotent — Ctrl+C / refresh UI OK, relancer."
