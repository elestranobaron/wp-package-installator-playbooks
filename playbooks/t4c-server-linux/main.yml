---
# T4C Server Linux — déploiement Docker cross-distro
# Utilise docker/Dockerfile + docker-compose.yml du repo t4c-server-linux
# Assets MEGA → {{ deploy_dir }}/docker/runtime/ (volume T4C_RUNTIME_ASSETS)
- name: Deploy T4C Server Linux (Docker)
  hosts: all
  become: true

  vars:
    deploy_dir: /opt/t4c-server
    github_repo: elestranobaron/t4c-server-linux
    release_tag: ""
    t4c_assets_dir: /opt/t4c-assets/serveur/runtime
    mega_server_url: "https://mega.nz/folder/92YQmLIL#3I9KTlXVp7jmqwu2_2bX_Q"
    t4c_udp_port: 11677
    db_name: t4c_server
    db_user: t4cuser
    db_password: ""
    db_root_password: ""
    t4c_verify_wda_md5: true
    enable_systemd: true
    t4c_staging_assets: /tmp/t4c-server-assets
    docker_runtime_dir: "{{ deploy_dir }}/docker/runtime"
    github_api: "https://api.github.com/repos/{{ github_repo }}"

  pre_tasks:
    - name: Gather OS facts
      ansible.builtin.setup:
        gather_subset: ["distribution", "architecture"]

    - name: Assert supported OS family
      ansible.builtin.assert:
        that:
          - ansible_os_family in ["Debian", "RedHat", "Archlinux", "Suse"]
        fail_msg: >
          OS non supporté : {{ ansible_os_family }}.
          Distributions supportées : Debian/Ubuntu, Fedora/RHEL, Arch, openSUSE.

    - name: Assert DB passwords are set
      ansible.builtin.assert:
        that:
          - db_password | length > 0
          - db_root_password | length > 0
        fail_msg: "Définir db_password et db_root_password dans Package Installator."

  tasks:
    # ── Docker (Debian / Ubuntu / Raspbian) ───────────────────────────────
    - name: "[Debian] Install Docker prerequisites"
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - rsync
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: "[Debian] Add Docker GPG key"
      ansible.builtin.shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
      when: ansible_os_family == "Debian"

    - name: "[Debian] Add Docker APT repository"
      ansible.builtin.shell: |
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/{{ ansible_distribution | lower }} \
          $(. /etc/os-release && echo "${VERSION_CODENAME:-$VERSION_ID}") stable" \
          > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list
      when: ansible_os_family == "Debian"

    - name: "[Debian] Install Docker Engine"
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    # ── Docker (Fedora / RHEL) ────────────────────────────────────────────
    - name: "[RedHat] Add Docker repository"
      ansible.builtin.shell: |
        dnf config-manager --add-repo \
          https://download.docker.com/linux/fedora/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo
      when: ansible_os_family == "RedHat"

    - name: "[RedHat] Install Docker Engine"
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - git
          - rsync
        state: present
      when: ansible_os_family == "RedHat"

    # ── Docker (Arch) ─────────────────────────────────────────────────────
    - name: "[Arch] Install Docker"
      community.general.pacman:
        name:
          - docker
          - docker-compose
          - git
          - rsync
        state: present
      when: ansible_os_family == "Archlinux"

    # ── Docker (openSUSE) ─────────────────────────────────────────────────
    - name: "[Suse] Install Docker"
      community.general.zypper:
        name:
          - docker
          - docker-compose
          - git
          - rsync
        state: present
      when: ansible_os_family == "Suse"

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # ── Release GitHub ──────────────────────────────────────────────────
    - name: Resolve release tag from GitHub API
      when: release_tag | length == 0
      block:
        - name: Query latest GitHub release
          ansible.builtin.uri:
            url: "{{ github_api }}/releases/latest"
            return_content: true
          register: gh_release
          failed_when: false

        - name: Fallback to tags list if no GitHub Release
          when: gh_release.status | default(0) != 200
          ansible.builtin.uri:
            url: "{{ github_api }}/tags"
            return_content: true
          register: gh_tags

        - name: Set resolved release tag
          ansible.builtin.set_fact:
            resolved_release_tag: >-
              {{
                gh_release.json.tag_name
                if (gh_release.status | default(0)) == 200
                else (gh_tags.json[0].name if (gh_tags.json | default([]) | length > 0) else 'main')
              }}

    - name: Use explicit release tag
      when: release_tag | length > 0
      ansible.builtin.set_fact:
        resolved_release_tag: "{{ release_tag }}"

    - name: Clone t4c-server-linux at release tag
      ansible.builtin.git:
        repo: "https://github.com/{{ github_repo }}.git"
        dest: "{{ deploy_dir }}"
        version: "{{ resolved_release_tag }}"
        force: true
        depth: 1

    - name: Ensure docker/runtime directory exists
      ansible.builtin.file:
        path: "{{ docker_runtime_dir }}"
        state: directory
        mode: "0755"

    # ── Assets Vircom (MEGA) ──────────────────────────────────────────────
    - name: Check local MEGA-synced assets
      ansible.builtin.stat:
        path: "{{ t4c_assets_dir }}/WDA/T4C Worlds.WDA"
      register: local_assets

    - name: Sync local MEGA assets → docker/runtime
      when: local_assets.stat.exists
      ansible.builtin.shell: |
        rsync -a \
          --exclude='logs/' \
          --exclude='SQL/' \
          "{{ t4c_assets_dir }}/" \
          "{{ docker_runtime_dir }}/"
      args:
        executable: /bin/bash

    - name: Download MEGA assets (Debian — MEGAcmd)
      when:
        - not local_assets.stat.exists
        - ansible_os_family == "Debian"
      block:
        - name: Install MEGAcmd (.deb)
          ansible.builtin.apt:
            deb: "https://mega.nz/linux/repo/Debian_12/{{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}/megacmd_2.1.1-1.1_{{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}.deb"
          failed_when: false

        - name: mega-get serveur/runtime from MEGA
          ansible.builtin.shell: |
            rm -rf "{{ t4c_staging_assets }}"
            mkdir -p "{{ t4c_staging_assets }}"
            mega-get "{{ mega_server_url }}" "{{ t4c_staging_assets }}"
          args:
            executable: /bin/bash

    - name: Download MEGA assets (Arch — megatools)
      when:
        - not local_assets.stat.exists
        - ansible_os_family == "Archlinux"
      block:
        - name: Install megatools
          community.general.pacman:
            name: megatools
            state: present

        - name: megadl serveur/runtime from MEGA
          ansible.builtin.shell: |
            rm -rf "{{ t4c_staging_assets }}"
            mkdir -p "{{ t4c_staging_assets }}"
            megadl --path="{{ t4c_staging_assets }}" "{{ mega_server_url }}"
          args:
            executable: /bin/bash

    - name: Locate and sync downloaded MEGA runtime
      when: not local_assets.stat.exists
      block:
        - name: Find WDA in MEGA staging
          ansible.builtin.find:
            paths: "{{ t4c_staging_assets }}"
            patterns: "T4C Worlds.WDA"
            recurse: true
          register: wda_found

        - name: Fail if assets missing
          ansible.builtin.assert:
            that:
              - local_assets.stat.exists or (wda_found.matched | default(0) > 0)
            fail_msg: >
              Assets Vircom introuvables. Configurez t4c_assets_dir
              (sync MEGA Desktop → serveur/runtime/) ou vérifiez mega_server_url.

        - name: Sync MEGA download → docker/runtime
          when: wda_found.matched | default(0) > 0
          ansible.builtin.shell: |
            MEGA_RUNTIME="$(dirname "$(dirname "$(find "{{ t4c_staging_assets }}" -name 'T4C Worlds.WDA' | head -1)")")"
            rsync -a --exclude='logs/' --exclude='SQL/' "${MEGA_RUNTIME}/" "{{ docker_runtime_dir }}/"
          args:
            executable: /bin/bash

    - name: Patch T4CServer.ini credentials in docker/runtime
      ansible.builtin.lineinfile:
        path: "{{ docker_runtime_dir }}/T4CServer.ini"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: false
      loop:
        - { regexp: '^DB_USER=', line: "DB_USER={{ db_user }}" }
        - { regexp: '^DB_PWD=', line: "DB_PWD={{ db_password }}" }
      failed_when: false

    - name: Ensure docker scripts are executable
      ansible.builtin.file:
        path: "{{ deploy_dir }}/docker/{{ item }}"
        mode: "0755"
      loop:
        - entrypoint.sh
        - sync-runtime-from-build.sh

    - name: Write docker compose .env
      ansible.builtin.copy:
        dest: "{{ deploy_dir }}/.env"
        mode: "0600"
        content: |
          MARIADB_ROOT_PASSWORD={{ db_root_password }}
          T4C_DB_NAME={{ db_name }}
          T4C_DB_USER={{ db_user }}
          T4C_DB_PASSWORD={{ db_password }}
          T4C_UDP_PORT={{ t4c_udp_port }}
          T4C_RUNTIME_ASSETS={{ docker_runtime_dir }}
          T4C_VERIFY_WDA_MD5={{ 1 if t4c_verify_wda_md5 | bool else 0 }}

    - name: Build and start stack (docker/Dockerfile + MariaDB)
      ansible.builtin.shell: docker compose up -d --build --remove-orphans
      args:
        chdir: "{{ deploy_dir }}"
      register: compose_up
      changed_when: true

    - name: Wait for UDP game port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ t4c_udp_port }}"
        timeout: 120
        state: started
      failed_when: false

    - name: Deploy systemd unit for docker compose stack
      when: enable_systemd | bool
      block:
        - name: Install t4c-server-docker.service
          ansible.builtin.copy:
            dest: /etc/systemd/system/t4c-server-docker.service
            mode: "0644"
            content: |
              [Unit]
              Description=T4C Server Linux (Docker Compose)
              Requires=docker.service
              After=docker.service network-online.target

              [Service]
              Type=oneshot
              RemainAfterExit=yes
              WorkingDirectory={{ deploy_dir }}
              ExecStart=/usr/bin/docker compose up -d
              ExecStop=/usr/bin/docker compose down
              TimeoutStartSec=600

              [Install]
              WantedBy=multi-user.target
          notify: Reload systemd

        - name: Enable t4c-server-docker service
          ansible.builtin.systemd:
            name: t4c-server-docker
            enabled: true
            daemon_reload: true

    - name: Print deployment summary
      ansible.builtin.debug:
        msg: |
          T4C Server Linux déployé (Docker)
          ─────────────────────────────────────────
          Release     : {{ resolved_release_tag }}
          Repo        : {{ deploy_dir }}
          Dockerfile  : {{ deploy_dir }}/docker/Dockerfile  (utilisé par compose)
          Assets      : {{ docker_runtime_dir }}/  ← MEGA serveur/runtime
          Compose     : {{ deploy_dir }}/docker-compose.yml
          Port UDP    : {{ t4c_udp_port }}
          MariaDB     : conteneur « mariadb » (réseau interne compose)
          Compte test : test / test
          ─────────────────────────────────────────
          Logs serveur : docker compose -f {{ deploy_dir }}/docker-compose.yml logs -f t4cserver
          Attendre     : [BOOT] SERVER_READY (1–3 min boot WDA)

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
